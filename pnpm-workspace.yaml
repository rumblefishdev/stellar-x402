packages:
  - apps/*
  - packages/*
  - examples/*
  - conformance
  # The server's units, scripts and agent config, tested against the metric catalog (0027).
  - deploy
  - contracts/upto-proxy/e2e
  - apps/mcp-local/e2e
  - infra

# `pnpm deploy` (the facilitator's image) copies workspace packages into its output.
injectWorkspacePackages: true

allowBuilds:
  esbuild: true

# Until upstream releases it (lore 0130): @x402/core refuses a whole 402 or payment whose
# serviceName, tags or iconUrl breaks a Bazaar limit, where the spec drops only that field. The
# patch is the upstream fix: those fields are typed only. Remove it with the bump.
patchedDependencies:
  "@x402/core@2.28.0": patches/@x402__core@2.28.0.patch
