name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    # The PostgreSQL store suite runs under CI and fails without a reachable database.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same version as contracts/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32v1-none
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path contracts/Cargo.toml --all --check
      - run: cargo clippy --manifest-path contracts/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path contracts/Cargo.toml
      # The WASM tests check the deployed interface (I7) and print the settlement cost.
      # soroban-sdk 28 only builds contract WASM through stellar-cli 25.2+.
      - uses: stellar/stellar-cli@v28.1.0
      - run: stellar contract build --manifest-path contracts/Cargo.toml
      - run: cargo test --manifest-path contracts/Cargo.toml -- --ignored --nocapture
