name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    # Every facilitator test runs on PostgreSQL and fails without a reachable database.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The OpenBao signer's tests (0036): a dev server, unsealed, with a known root token.
      openbao:
        # The digest production pins (deploy/openbao/compose.yaml), so CI tests that image.
        image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
        env:
          BAO_DEV_ROOT_TOKEN_ID: root
        ports:
          - 8200:8200
        options: >-
          --health-cmd "bao status -address=http://127.0.0.1:8200"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_OPENBAO_ADDR: http://127.0.0.1:8200
      TEST_OPENBAO_TOKEN: root
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The board script stops on an owner that isn't in team.yaml (0144): here, so a typo fails
      # the pull request instead of every board deploy after it.
      - run: pnpm board

  # Production's Postgres from its own compose file, as its unit starts it (task 0091). On every
  # pull request, not only those under deploy/: a job skipped by a paths filter can't be required.
  production-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: deploy/scripts/check-production-postgres.sh

  # The Rust SDK (task 0136), apart from contracts/, which builds WASM with its own profile.
  sdk-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same version as packages/sdk/rust/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path packages/sdk/rust/Cargo.toml --all --check
      # With the axum layer and without it: the core must build alone. `--locked`: a stale
      # Cargo.lock fails here and not only on 1.81.
      - run: cargo clippy --manifest-path packages/sdk/rust/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo clippy --manifest-path packages/sdk/rust/Cargo.toml --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --manifest-path packages/sdk/rust/Cargo.toml --locked
      - run: cargo test --manifest-path packages/sdk/rust/Cargo.toml --locked --no-default-features
      # The oldest Rust the crate promises, `rust-version` in its Cargo.toml, with Cargo.lock's
      # versions, with the layer and without it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.81.0
      - run: cargo +1.81.0 check --manifest-path packages/sdk/rust/Cargo.toml --locked
      - run: cargo +1.81.0 check --manifest-path packages/sdk/rust/Cargo.toml --locked --no-default-features

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same version as contracts/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32v1-none
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path contracts/Cargo.toml --all --check
      - run: cargo clippy --manifest-path contracts/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path contracts/Cargo.toml
      # The WASM tests check the deployed interface (I7) and print the settlement cost.
      # soroban-sdk 28 only builds contract WASM through stellar-cli 25.2+.
      - uses: stellar/stellar-cli@v28.1.0
      - run: stellar contract build --manifest-path contracts/Cargo.toml
      - run: cargo test --manifest-path contracts/Cargo.toml -- --ignored --nocapture
