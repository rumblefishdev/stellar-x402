name: Upstream watch

# Weekly, an issue when upstream x402 has changed a file the conformance gate's suite rests on since
# the pinned commit (task 0029). The RFP asks to track the spec through the grant.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scheduled and manual runs use the default branch's copy of this file, which is main; the
          # script and the pin live on develop.
          ref: develop
          persist-credentials: false

      - name: Open an issue on a change
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          changed=$(bash conformance/upstream-watch.sh)
          if [ -z "$changed" ]; then
            echo "No change since the pin"
            exit 0
          fi
          title="Upstream changed a file the conformance gate rests on"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')
          if [ -n "$open" ]; then
            echo "Issue #$open already says so"
            exit 0
          fi
          pin=$(grep -oE '[0-9a-f]{40}' conformance/src/upstream.ts)
          body=$(printf '%s\n' \
            "Changed on x402-foundation/x402 main since the pin \`$pin\`:" "" \
            "$(printf -- '- `%s`\n' $changed)" "" \
            "Changes: https://github.com/x402-foundation/x402/compare/$pin...main" "" \
            "Read them. Then bump the pin in \`conformance/src/upstream.ts\` and rerun the gate, or close this issue saying why not.")
          gh issue create --title "$title" --body "$body"
