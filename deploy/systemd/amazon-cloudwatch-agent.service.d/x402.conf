# The package's agent unit, changed only here (lore 0027 decision 46): at boot the signing
# helper's first run goes first, and the agent starts whether it succeeded or not, reading the
# keys when they appear. Nothing of ours is ordered after the agent, so an AWS outage never holds
# up a container. The region is in the agent's JSON, not here: the start wrapper translates the
# config with this unit's environment at every start.
[Unit]
Wants=x402-cloudwatch-credentials.service
After=x402-cloudwatch-credentials.service
