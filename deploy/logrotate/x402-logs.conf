# The files our units and the host probe write (lore 0027 decision 45), installed as
# /etc/x402/logrotate.conf and run by x402-logrotate.timer every 10 minutes with its own state.
# copytruncate: the units and the agent keep the files open. Each rotation may lose the lines
# the agent hadn't read yet, up to 250 ms, and during an AWS outage every app line since it
# stopped sending; both stay in the rotated file, uncompressed until the next one (ADR 0011).
# The globs never reach production/emf/, the metrics entry's symlink.
# Daily, or sooner past 100 MB, 10 kept and none past 30 days: the hub's privacy policy keeps log
# lines up to 30 days, and the portal's lines name a key while the facilitator's name its caller
# (`discord:<id>` on pubnet). By size alone a quiet file never rotated, and maxage is read only
# when a file rotates, so every file rotates daily, empty or not (0106).
/var/log/x402/production/*.log /var/log/x402/openbao/*.log /var/log/x402/host/*.log /var/log/x402/metrics/*.log {
    daily
    maxsize 100M
    rotate 10
    maxage 30
    copytruncate
    compress
    delaycompress
    missingok
    ifempty
    nomail
}
