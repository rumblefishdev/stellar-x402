# The files our units and the host probe write (lore 0027 decision 45), installed as
# /etc/x402/logrotate.conf and run by x402-logrotate.timer every 10 minutes with its own state.
# copytruncate: the units and the agent keep the files open. Each rotation may lose the lines
# the agent hadn't read yet, up to 250 ms, and during an AWS outage every app line since it
# stopped sending; both stay in the rotated file, uncompressed until the next one (ADR 0011).
# The globs never reach production/emf/, the metrics entry's symlink.
/var/log/x402/production/*.log /var/log/x402/openbao/*.log /var/log/x402/host/*.log {
    size 100M
    rotate 10
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
    nomail
}
