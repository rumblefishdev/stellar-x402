# promtool test rules for x402-production.yml (PR #211, review points 4 and 5), by Karol
# Kowalczyk. Run from deploy/metrics/rules/ (CI's prometheus-rules job runs it):
#   docker run --rm --entrypoint promtool -v "$PWD":/r -w /r prom/prometheus:v3.16.0 \
#     test rules event-restart-and-pool-health.test.yml
# The two "control" tests passed at 36e1d5bb; the two "point" tests failed there and pass since
# the Event rule's fix. Point 4 carries the liveness series a real restart writes, which the fix
# reads.
rule_files: [x402-production.yml]
evaluation_interval: 1m

tests:
  - name: "control: history-gone counted 0 -> 1 fires"
    interval: 15s
    input_series:
      - series: 'settlement_history_gone_total{project="x402",network="stellar:testnet"}'
        values: '0x20 1x60'
    alert_rule_test:
      - eval_time: 7m
        alertname: x402-event
        exp_alerts:
          - exp_labels: &history_gone
              {check: history-gone, severity: warning, shape: event, project: x402, network: "stellar:testnet"}
            exp_annotations: &history_gone_text
              description: "A settlement record on stellar:testnet has hashes the RPC's history no longer reaches; it stays open until an operator closes it. Every restart or deploy reports each such record again; this sends one message for them, so read the log for each record. Next: Match the settlementKey in settlement_history_gone against the records already being handled, check the hashes on Horizon, and close the record by hand (0019 decision 22). No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, history-gone."

  # The old process counts one record at 1m and stops at 5m. A restart 20 minutes later reports
  # the record again in its first sweep (every 10 s), before the first scrape (every 15 s), so the
  # new process's first sample is already 1: same labels, same value, no step for increase().
  # Each process writes its start time on facilitator_started_timestamp_seconds: 0 for the old
  # one, 1530 (25m30s) for the new one, from its first sample on.
  - name: "point 4: history-gone reported again after a restart fires"
    interval: 15s
    input_series:
      - series: 'settlement_history_gone_total{project="x402",network="stellar:testnet"}'
        values: '0x4 1x16 stale _x80 1x40'
      - series: 'facilitator_started_timestamp_seconds{project="x402"}'
        values: '0x20 stale _x80 1530x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: x402-event
        exp_alerts:
          - exp_labels: *history_gone
            exp_annotations: *history_gone_text

  - name: "control: 5 sequence resyncs within 2 minutes fire pool-health"
    interval: 15s
    input_series:
      - series: 'pool_events_total{project="x402",network="stellar:testnet",type="sequence-resync"}'
        values: '0x40 1x1 2x1 3x1 4x1 5x60'
    alert_rule_test:
      - eval_time: 18m
        alertname: x402-event
        exp_alerts:
          - exp_labels: &pool_health
              {check: pool-health, severity: warning, shape: event, project: x402, network: "stellar:testnet", type: sequence-resync}
            exp_annotations: &pool_health_text
              description: "Channels on stellar:testnet resynced their sequence numbers 5 or more times in 5 minutes: something else uses the channel accounts, or submissions keep failing. Next: pool_events_total with type sequence-resync shows when; the log doesn't name the channels yet (task 0125), so read the channel accounts' transactions on Horizon. Make sure no other process holds the facilitator key. No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, pool-health."

  # One resync a minute from 10m15s to 14m15s: 5 inside one 5-minute period, which the
  # CloudWatch alarm counts as 5. The 1-minute subquery and increase()'s extrapolation see ~4.2.
  - name: "point 5: 5 sequence resyncs within 4 minutes fire pool-health"
    interval: 15s
    input_series:
      - series: 'pool_events_total{project="x402",network="stellar:testnet",type="sequence-resync"}'
        values: '0x40 1x3 2x3 3x3 4x3 5x60'
    alert_rule_test:
      - eval_time: 18m
        alertname: x402-event
        exp_alerts:
          - exp_labels: *pool_health
            exp_annotations: *pool_health_text
