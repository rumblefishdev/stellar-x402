02\",breaker=\"pay_to\"}[15m])) > 0 or (sum by (network, breaker) (spend_breaker_opened_total{project=\"x402\",breaker=\"pay_to\"}) > 0 and on() (time() - max(facilitator_started_timestamp_seconds{project=\"x402\"}) < 900)), \"check\", \"breaker-opened-pay-to\", \"\", \"\"), \"severity\", \"critical\", \"\", \"\") or label_replace(label_replace(sum by (network, breaker) (increase(spend_breaker_opened_total{project=\"x402\",breaker=\"asset\"}[15m])) > 0 or (sum by (network, breaker) (spend_breaker_opened_total{project=\"x402\",breaker=\"asset\"}) > 0 and on() (time() - max(facilitator_started_timestamp_seconds{project=\"x402\"}) < 900)), \"check\", \"breaker-opened-asset\", \"\", \"\"), \"severity\", \"critical\", \"\", \"\") or label_replace(label_replace(sum by (network) (increase(spend_budget_nearing_total{project=\"x402\"}[20m])) > 0 or (sum by (network) (spend_budget_nearing_total{project=\"x402\"}) > 0 and on() (time() - max(facilitator_started_timestamp_seconds{project=\"x402\"}) < 1200)), \"check\", \"budget-nearing\", \"\", \"\"), \"severity\", \"critical\", \"\", \"\") or label_replace(label_replace(sum by (network) (increase(settlement_record_failures_total{project=\"x402\"}[15m])) > 0 or (sum by (network) (settlement_record_failures_total{project=\"x402\"}) > 0 and on() (time() - max(facilitator_started_timestamp_seconds{project=\"x402\"}) < 900)), \"check\", \"store-outage\", \"\", \"\"), \"severity\", \"warning\", \"\", \"\") or label_replace(label_replace(sum by (network) (increase(spend_store_failures_total{project=\"x402\"}[15m])) > 0 or (sum by (network) (spend_store_failures_total{project=\"x402\"}) > 0 and on() (time() - max(facilitator_started_timestamp_seconds{project=\"x402\"}) < 900)), \"check\", \"store-outage\", \"\", \"\"), \"severity\", \"warning\", \"\", \"\") or label_replace(label_replace(sum by (network, stage) (increase(settlement_refused_after_verify_total{project=\"x402\",stage=\"pool\"}[15m])) > 0 or (sum by (network, stage) (settlement_refused_after_verify_total{project=\"x402\",stage=\"pool\"}) > 0 and on() (time() - max(facilitator_started_timestamp_seconds{project=\"x402\"}) < 900)), \"check\", \"refused-after-verify\", \"\", \"\"), \"severity\", \"warning\", \"\", \"\") or label_replace(label_replace(sum by (network) (increase(settlement_history_gone_total{project=\"x402\"}[15m])) > 0 or (sum by (network) (settlement_history_gone_total{project=\"x402\"}) > 0 and on() (time() - max(facilitator_started_timestamp_seconds{project=\"x402\"}) < 900)), \"check\", \"history-gone\", \"\", \"\"), \"severity\", \"warning\", \"\", \"\") or label_replace(label_replace(sum by (network) (increase(settlement_landed_after_expired_total{project=\"x402\"}[15m])) > 0 or (sum by (network) (settlement_landed_after_expired_total{project=\"x402\"}) > 0 and on() (time() - max(facilitator_started_timestamp_seconds{project=\"x402\"}) < 900)), \"check\", \"landed-after-expired\", \"\", \"\"), \"severity\", \"critical\", \"\", \"\") or label_replace(label_replace(sum by (network, state) (increase(settlement_reconciled_total{project=\"x402\",state=\"expired\"}[15m])) > 0 or (sum by (network, state) (settlement_reconciled_total{project=\"x402\",state=\"expired\"}) > 0 and on() (time() - max(facilitator_started_timestamp_seconds{project=\"x402\"}) < 900)), \"check\", \"settlement-expired\", \"\", \"\"), \"severity\", \"warning\", \"\", \"\") or label_replace(label_replace(sum by (network) (increase(settlement_submit_failures_total{project=\"x402\"}[15m])) > 0 or (sum by (network) (settlement_submit_failures_total{project=\"x402\"}) > 0 and on() (time() - max(facilitator_started_timestamp_seconds{project=\"x402\"}) < 900)), \"check\", \"submit-failed\", \"\", \"\"), \"severity\", \"warning\", \"\", \"\") or label_replace(label_replace(sum by (network) (increase(settlement_hook_failures_total{project=\"x402\"}[15m])) > 0 or (sum by (network) (settlement_hook_failures_total{project=\"x402\"}) > 0 and on() (time() - max(facilitator_started_timestamp_seconds{project=\"x402\"}) < 900)), \"check\", \"hook-failures\", \"\", \"\"), \"severity\", \"warning\", \"\", \"\") or label_replace(label_replace(sum by (network) (increase(signer_failures_total{project=\"x402\"}[15m])) > 0 or (sum by (network) (signer_failures_total{project=\"x402\"}) > 0 and on() (time() - max(facilitator_started_timestamp_seconds{project=\"x402\"}) < 900)), \"check\", \"signer-failures\", \"\", \"\"), \"severity\", \"warning\", \"\", \"\") or label_replace(label_replace(max_over_time((sum by (network, type) (increase(pool_events_total{project=\"x402\",type=\"sequence-resync\"}[5m])))[15m:15s]) >= 5, \"check\", \"pool-health\", \"\", \"\"), \"severity\", \"warning\", \"\", \"\") or label_replace(label_replace(sum by (network, fault) (increase(spend_failure_attributed_total{project=\"x402\",fault=\"ours\"}[15m])) > 0 or (sum by (network, fault) (spend_failure_attributed_total{project=\"x402\",fault=\"ours\"}) > 0 and on() (time() - max(facilitator_started_timestamp_seconds{project=\"x402\"}) < 900)), \"check\", \"failure-ours\", \"\", \"\"), \"severity\", \"warning\", \"\", \"\") or label_replace(label_replace(sum by (network) (increase(spend_commit_unmatched_total{project=\"x402\"}[15m])) > 0 or (sum by (network) (spend_commit_unmatched_total{project=\"x402\"}) > 0 and on() (time() - max(facilitator_started_timestamp_seconds{project=\"x402\"}) < 900)), \"check\", \"commit-unmatched\", \"\", \"\"), \"severity\", \"critical\", \"\", \"\") or label_replace(label_replace(sum(increase(facilitator_failures_total{project=\"x402\"}[15m])) > 0, \"check\", \"facilitator-failed\", \"\", \"\"), \"severity\", \"warning\", \"\", \"\") or label_replace(label_replace(sum(increase(watchdog_restarts_total{project=\"x402\"}[15m])) > 0, \"check\", \"watchdog-restart\", \"\", \"\"), \"severity\", \"warning\", \"\", \"\")",
          "labels": {
            "shape": "event",
            "project": "x402"
          },
          "annotations": {
            "description": "{{ if eq $labels.check \"http-500\" }}The facilitator answered with status 500, across every route and network: an error it doesn't classify, so it treats it as ours. A burst sends one message. A 503 isn't counted: verify-rpc-unavailable covers /verify's, and a lease or drain 503 on /settle is routine. Next: Read the error lines around that time in /x402/production/app with Logs Insights. No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, http-500.{{ else if eq $labels.check \"verify-rpc-unavailable\" }}/verify answered 503 rpc_unavailable: no RPC URL gave upstream's verify a verdict (each hung for 10 s or answered unexpected_verify_error), or the facilitator's ledger read failed on every URL. Sellers can't check payments, so buyers are refused. A burst sends one message. Next: Read verify_rpc_unavailable and rpc_exhausted in /x402/production/app with Logs Insights: rpc_exhausted names each URL and why it failed. No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, verify-rpc-unavailable.{{ else if eq $labels.check \"search-words-only\" }}A Bazaar search was answered by words alone: the search model did not give the query's vector within the timeout, failed, or is down. A model container that restarts fires it for the searches of those seconds. An outage sends one message; one after a quiet minute sends another. Next: Check the search-model container's health and logs on the server (x402-compose production ps search-model, then logs search-model), then search_words_only in /x402/production/app with Logs Insights for its cause. No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, search-words-only.{{ else if eq $labels.check \"search-vector-failed\" }}The search model gave no vector for a listing, or the start's pass could not read the cards: search by meaning leaves the listing out, and answers partial, until the next start's pass embeds it. Next: Read search_vector_failed and search_vectors_read_failed in /x402/production/app with Logs Insights for the listing and the cause, then the search-model container's health (x402-compose production ps search-model). A restart of x402@production embeds the listings still without a vector. No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, search-vector-failed.{{ else if eq $labels.check \"breaker-opened-payer\" }}The payer spend breaker opened on {{ $labels.network }}: one payer's settlements failed on chain past its limit, and its payments are refused for the cool-down (0024). Next: Read spend_breaker_opened in the app logs for the scope, then the failures that tripped it. No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, breaker-opened.{{ else if eq $labels.check \"breaker-opened-pay-to\" }}The pay_to spend breaker opened on {{ $labels.network }}: settlements to one seller failed on chain past its limit, and its payments are refused for the cool-down (0024). Next: Read spend_breaker_opened in the app logs for the scope, then the failures that tripped it. No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, breaker-opened.{{ else if eq $labels.check \"breaker-opened-asset\" }}The asset spend breaker opened on {{ $labels.network }}: one wasm token's transfers failed on chain past its limit, and its payments are refused for the cool-down (0024). Next: Read spend_breaker_opened in the app logs for the scope, then the failures that tripped it. No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, breaker-opened.{{ else if eq $labels.check \"budget-nearing\" }}A fee budget on {{ $labels.network }} (asset, other, free or global) passed its nearing level: at its limit, settlement for that scope stops until the window rolls (0024; free, every account on the free plan, 0107). The 4 five-minute periods match its 15-minute repeat. Next: Read spend_budget_nearing in the app logs for the scope, the used and max stroops; raise the budget only if the traffic is real. No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, budget-nearing.{{ else if eq $labels.check \"store-outage\" }}A read or write to Postgres failed on {{ $labels.network }}: a settlement record or the spend store, an account's plan among its reads. Settle answers may be lost from the records, and the spend policy may be blind. Next: Check x402-db-{{ reReplaceAll \"^stellar:\" \"\" $labels.network }}@production and its log, then settlement_record_failed and spend_store_failed in the app logs for the operation. No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, store-outage.{{ else if eq $labels.check \"refused-after-verify\" }}Settle on {{ $labels.network }} refused, at the pool, a payment that verify had accepted: the fee went over its cap or the ledger bound passed while it waited. Next: Read settlement_refused_after_verify in the app logs for the reason; check queue-waiting and the fee settings. No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, refused-after-verify.{{ else if eq $labels.check \"history-gone\" }}A settlement record on {{ $labels.network }} has hashes the RPC's history no longer reaches; it stays open until an operator closes it. Every restart or deploy reports each such record again; this sends one message for them, so read the log for each record. Next: Match the settlementKey in settlement_history_gone against the records already being handled, check the hashes on Horizon, and close the record by hand (0019 decision 22). No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, history-gone.{{ else if eq $labels.check \"landed-after-expired\" }}A transaction on {{ $labels.network }} landed after its record was marked expired: the payer may have been told the payment failed while it settled. Next: Read settlement_landed_after_expired in the app logs for the record, and reconcile it with the payer. No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, landed-after-expired.{{ else if eq $labels.check \"settlement-expired\" }}A settlement on {{ $labels.network }} expired: reconciliation found no transaction of it landed by its ledger bound, so the payer's payment did not settle and the payer has to sign a new one. One is rare; several mean submissions don't land. Next: Read reconcile_finished and the record's settlement_hashes for its attempts, then the fee-raised and send-retry counts (pool_events_total by type, in Prometheus on the monitoring VM; counts only, task 0125) and the RPC around that time. No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, settlement-expired.{{ else if eq $labels.check \"submit-failed\" }}Settle on {{ $labels.network }} failed with unexpected_settle_error before anything was sent: the payer got status 200 with success false, which http-500 doesn't see. Next: Read settlement_submit_failed in the app logs for the error; it is a bug or an outage we don't classify yet. No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, submit-failed.{{ else if eq $labels.check \"hook-failures\" }}A settlement hook threw on {{ $labels.network }}: the spend policy's fee count, failure count or breaker may have missed a final settlement, so budgets and breakers undercount. Next: Read settlement_hook_failed in the app logs for the hook and the error, and spend_store_failed if the store is the cause. No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, hook-failures.{{ else if eq $labels.check \"signer-failures\" }}OpenBao did not give a usable signature on {{ $labels.network }} (sealed, denied or a wrong key): settlement fails. The check after start counts each retry; this sends one message for them. Next: Read signer_failed in the app logs for the reason and step, then OpenBao's status and audit log (docs/runbook.md, OpenBao). No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, signer-failures.{{ else if eq $labels.check \"pool-health\" }}Channels on {{ $labels.network }} resynced their sequence numbers 5 or more times in 5 minutes: something else uses the channel accounts, or submissions keep failing. Next: pool_events_total with type sequence-resync shows when; the log doesn't name the channels yet (task 0125), so read the channel accounts' transactions on Horizon. Make sure no other process holds the facilitator key. No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, pool-health.{{ else if eq $labels.check \"failure-ours\" }}A settlement on {{ $labels.network }} failed for a reason attributed to us, not to the payer, the seller or the asset. Next: Read spend_failure_ours in the app logs for the reason. No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, failure-ours.{{ else if eq $labels.check \"commit-unmatched\" }}A settled fee on {{ $labels.network }} counts against no budget: its reservation was never made or was pruned meanwhile, so the fee budgets undercount. Next: Read spend_commit_unmatched in the app logs for the key and state, and compare with the settlement record. No data: Nothing happened; facilitator-silent covers a stopped process. Runbook: docs/monitoring.md, commit-unmatched.{{ else if eq $labels.check \"facilitator-failed\" }}x402@production ended other than in success: a crash, a failed start, a drain cut short, a dockerd crash, or the watchdog's kill of a hung process (watchdog-restart fires beside it). A crash after ready in cycles of a minute or more never reaches the unit's start limit, so this is what shows it. Next: Read result and exit_status in its line in /var/log/x402/host/metrics.log, then the end of /var/log/x402/production/facilitator.log and facilitator.err.log before it (docs/runbook.md, The watchdog). No data: Nothing ended in failure; a stopped agent is server-silent's. Runbook: docs/monitoring.md, facilitator-failed.{{ else if eq $labels.check \"watchdog-restart\" }}The watchdog stopped an unhealthy facilitator and restarted its unit. Next: Read the app log before the restart and journalctl -u x402-watchdog@production (docs/runbook.md, The watchdog). No data: Nothing restarted; a stopped watchdog leaves a hung facilitator to uptime. Runbook: docs/monitoring.md, watchdog-restart.{{ end }}"
          }
        },
        {
          "alert": "x402-facilitator-silent",
          "expr": "absent(facilitator_started_timestamp_seconds{project=\"x402\"})",
          "for": "10m",
          "labels": {
            "check": "facilitator-silent",
            "severity": "critical",
            "shape": "server",
            "project": "x402"
          },
          "annotations": {
            "description": "The facilitator's liveness series has been missing for 10 minutes: the process is down, its /metrics isn't scraped, or the agent's samples don't reach the VM. It fires beside uptime when the process is down. Next: Check uptime first; then x402@production on the server, and server-silent and target-down for the agent. No data: Absence is what this rule is for. Runbook: docs/monitoring.md, facilitator-silent."
          }
        },
        {
          "alert": "x402-gauge-stale",
          "expr": "(label_replace(time() - settlement_oldest_open_seconds_last_read_timestamp_seconds{project=\"x402\"} > 600, \"gauge\", \"settlement_oldest_open_seconds\", \"\", \"\") or label_replace(absent(settlement_oldest_open_seconds_last_read_timestamp_seconds{project=\"x402\",network=\"stellar:testnet\"}), \"gauge\", \"settlement_oldest_open_seconds\", \"\", \"\") or label_replace(time() - pool_queued_last_read_timestamp_seconds{project=\"x402\"} > 600, \"gauge\", \"pool_queued\", \"\", \"\") or label_replace(absent(pool_queued_last_read_timestamp_seconds{project=\"x402\",network=\"stellar:testnet\"}), \"gauge\", \"pool_queued\", \"\", \"\") or label_replace(time() - pool_quarantined_last_read_timestamp_seconds{project=\"x402\"} > 600, \"gauge\", \"pool_quarantined\", \"\", \"\") or label_replace(absent(pool_quarantined_last_read_timestamp_seconds{project=\"x402\",network=\"stellar:testnet\"}), \"gauge\", \"pool_quarantined\", \"\", \"\") or label_replace(time() - rpc_on_fallback_last_read_timestamp_seconds{project=\"x402\"} > 600, \"gauge\", \"rpc_on_fallback\", \"\", \"\") or label_replace(absent(rpc_on_fallback_last_read_timestamp_seconds{project=\"x402\",network=\"stellar:testnet\"}), \"gauge\", \"rpc_on_fallback\", \"\", \"\") or label_replace(time() - rpc_stalled_seconds_last_read_timestamp_seconds{project=\"x402\"} > 600, \"gauge\", \"rpc_stalled_seconds\", \"\", \"\") or label_replace(absent(rpc_stalled_seconds_last_read_timestamp_seconds{project=\"x402\",network=\"stellar:testnet\"}), \"gauge\", \"rpc_stalled_seconds\", \"\", \"\") or label_replace(time() - balance_reading_age_seconds_last_read_timestamp_seconds{project=\"x402\"} > 600, \"gauge\", \"balance_reading_age_seconds\", \"\", \"\") or label_replace(absent(balance_reading_age_seconds_last_read_timestamp_seconds{project=\"x402\",network=\"stellar:testnet\"}), \"gauge\", \"balance_reading_age_seconds\", \"\", \"\")) and on() facilitator_started_timestamp_seconds{project=\"x402\"}",
          "for": "5m",
          "labels": {
            "check": "gauge-stale",
            "severity": "critical",
            "shape": "server",
            "project": "x402"
          },
          "annotations": {
            "description": "A facilitator gauge on {{ $labels.network }} has had no successful read for 15 minutes, or none since the start, while the process runs: its read keeps failing, and the rules on it see its last value or nothing. Gauge: {{ $labels.gauge }}. Next: Find the gauge's read error in the app logs (metric_issue, read-failed). No data: With the process down, facilitator-silent fires instead. Runbook: docs/monitoring.md, gauge-stale."
          }
        },
        {
          "alert": "x402-textfile-stale",
          "expr": "time() - node_textfile_mtime_seconds{project=\"x402\"} > 300 or node_textfile_scrape_error{project=\"x402\"} > 0 or ((label_replace(absent(node_textfile_mtime_seconds{project=\"x402\",file=~\"(.*/)?host-probe\\\\.prom\"}), \"file\", \"host-probe.prom\", \"\", \"\") or label_replace(absent(node_textfile_mtime_seconds{project=\"x402\",file=~\"(.*/)?watchdog_restarts_total\\\\.prom\"}), \"file\", \"watchdog_restarts_total.prom\", \"\", \"\") or label_replace(absent(node_textfile_mtime_seconds{project=\"x402\",file=~\"(.*/)?facilitator_failures_total\\\\.prom\"}), \"file\", \"facilitator_failures_total.prom\", \"\", \"\")) and on() up{project=\"x402\",job=\"node\"} == 1)",
          "labels": {
            "check": "textfile-stale",
            "severity": "warning",
            "shape": "server",
            "project": "x402"
          },
          "annotations": {
            "description": "A host probe textfile ({{ $labels.file }}) is over 5 minutes old, missing, or unreadable, so the probe's rules read stale values: OpenBao, WAL, the backups, the snapshot and the certificates. Next: On the server: the x402-host-probe timer and its journal, and the files in /var/lib/x402/textfile. No data: A stopped agent sends nothing; server-silent fires instead. Runbook: docs/monitoring.md, textfile-stale."
          }
        },
        {
          "alert": "x402-server-silent",
          "expr": "absent_over_time(up{project=\"x402\",job=\"node\"}[5m])",
          "labels": {
            "check": "server-silent",
            "severity": "warning",
            "shape": "server",
            "project": "x402"
          },
          "annotations": {
            "description": "No sample from ch-prod-01's metrics agent for 5 minutes: the agent, the server or its way out is down, or the VM refuses its writes. The metrics from before are kept. Next: On the server: systemctl status x402-metrics and /var/log/x402/metrics/agent.log (docs/runbook.md, The metrics agent), then the agent's certificate. No data: Absence is what this rule is for. Runbook: docs/monitoring.md, server-silent."
          }
        },
        {
          "alert": "x402-target-down",
          "expr": "up{project=\"x402\"} == 0",
          "for": "5m",
          "labels": {
            "check": "target-down",
            "severity": "warning",
            "shape": "server",
            "project": "x402"
          },
          "annotations": {
            "description": "The metrics agent on ch-prod-01 has failed to scrape {{ $labels.job }} for 5 minutes, so its rules see nothing new. Next: On the server: the target's container in /srv/x402/metrics, or the facilitator's /metrics on the x402-metrics network. No data: A stopped agent sends nothing; server-silent fires instead. Runbook: docs/monitoring.md, target-down."
          }
        },
        {
          "alert": "x402-agent-behind",
          "expr": "max(prometheus_remote_storage_queue_highest_timestamp_seconds{project=\"x402\",job=\"agent\"} - prometheus_remote_storage_queue_highest_sent_timestamp_seconds{project=\"x402\",job=\"agent\"}) > 120 or sum(increase(prometheus_remote_storage_samples_failed_total{project=\"x402\",job=\"agent\"}[15m])) > 0",
          "for": "5m",
          "labels": {
            "check": "agent-behind",
            "severity": "warning",
            "shape": "server",
            "project": "x402"
          },
          "annotations": {
            "description": "The metrics agent on ch-prod-01 is over 2 minutes behind in sending to the VM, or the VM refused samples it then dropped: the rules read old or missing data while the agent still looks up. Past 5 minutes behind, its samples land outside the rules' lookback and server-silent fires instead. Next: On the server: /var/log/x402/metrics/agent.log for remote_write errors (a 4xx names refused samples, a 5xx or timeout the VM or the way to it), then Caddy's log on the VM. No data: An agent that sends nothing is server-silent. Runbook: docs/monitoring.md, agent-behind."
          }
        },
        {
          "alert": "x402-agent-certificate",
          "expr": "certificate_days_left{project=\"x402\",certificate=\"metrics-agent\"} < 30",
          "labels": {
            "check": "agent-certificate",
            "severity": "warning",
            "shape": "server",
            "project": "x402"
          },
          "annotations": {
            "description": "The metrics agent's client certificate has under 30 days left, or its check fails. When it expires, the VM refuses the agent's writes and server-silent fires with no cause shown. Next: Renew it as docs/runbook.md, The metrics agent, says. No data: textfile-stale covers a stopped probe. Runbook: docs/monitoring.md, agent-certificate."
          }
        }
      ]
    }
  ]
}
