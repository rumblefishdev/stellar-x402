# Generated by `make rules` in infra/ from the alarm rows (lore 0139 step 6). Don't edit.
{
  "groups": [
    {
      "name": "x402-production",
      "rules": [
        {
          "alert": "x402-rpc-stalled",
          "expr": "max by (network) (max_over_time(rpc_stalled_seconds{project=\"x402\"}[1m])) > 120",
          "for": "4m",
          "labels": {
            "check": "rpc-stalled",
            "severity": "warning",
            "shape": "level",
            "project": "x402"
          },
          "annotations": {
            "description": "The latest ledger on {{ $labels.network }}, read through the facilitator's RPC, has not moved for over 120 s for 5 minutes: the active endpoint is frozen or unreachable, and verify and settle read stale state. ready does not show this. Next: Read rpc_failover and rpc_failback in the app logs and check the endpoints in RPC_URLS by their RPC_URLS[i]#fingerprint names; fix or reorder them. No data: Resolves once its series stops, which is no recovery; facilitator-silent covers a stopped process. OK once it is back within its threshold; the next crossing fires it again. Runbook: docs/monitoring.md, rpc-stalled."
          }
        },
        {
          "alert": "x402-balance-stale",
          "expr": "max by (network) (max_over_time(balance_reading_age_seconds{project=\"x402\"}[1m])) > 300",
          "labels": {
            "check": "balance-stale",
            "severity": "warning",
            "shape": "level",
            "project": "x402"
          },
          "annotations": {
            "description": "The fee account's last good balance reading on {{ $labels.network }} is older than 300 s: the balance floor fails closed and settle refuses every payment with facilitator_underfunded, while ready stays 1 and the balance read off the server looks fine. Next: Check the RPC (rpc-stalled, rpc-on-fallback) and the floor's failed reads in the app logs; a floor bound other than 300 s logs balance_stale_threshold_mismatch at startup. No data: Resolves once its series stops, which is no recovery; facilitator-silent covers a stopped process. OK once it is back within its threshold; the next crossing fires it again. Runbook: docs/monitoring.md, balance-stale."
          }
        },
        {
          "alert": "x402-search-model-down",
          "expr": "max(max_over_time(search_model_up{project=\"x402\"}[1m])) < 1",
          "for": "4m",
          "labels": {
            "check": "search-model-down",
            "severity": "warning",
            "shape": "level",
            "project": "x402"
          },
          "annotations": {
            "description": "The search model has not answered the facilitator's health check for 5 minutes, whether anyone searched or not: search runs on words alone and no listing gets a vector. Next: Check the search-model container on the server (x402-compose production ps search-model, then logs search-model): a restart loop, out of memory, or an image without the model. No data: Resolves once its series stops, which is no recovery; facilitator-silent covers a stopped process. OK once it is back within its threshold; the next crossing fires it again. Runbook: docs/monitoring.md, search-model-down."
          }
        },
        {
          "alert": "x402-pending",
          "expr": "max by (network) (max_over_time(settlement_oldest_open_seconds{project=\"x402\"}[1m])) > 900",
          "for": "2m",
          "labels": {
            "check": "pending",
            "severity": "critical",
            "shape": "level",
            "project": "x402"
          },
          "annotations": {
            "description": "A settlement on {{ $labels.network }} has been open for over 900 s, past the 750 s a record can last at the cap: reconciliation is not closing it. A sweep that hangs after one that left nothing open reads 0 here; sweeps-stopped catches that. Next: Read settlement_reconcile_failed and reconcile_failed in the app logs, and the record's settlement_hashes. history-gone records are left out, but count again after a restart until a sweep reads their history. No data: Resolves once its series stops, which is no recovery; facilitator-silent covers a stopped process. OK once it is back within its threshold; the next crossing fires it again. Runbook: docs/monitoring.md, pending."
          }
        },
        {
          "alert": "x402-queue-waiting",
          "expr": "min by (network) (min_over_time(pool_queued{project=\"x402\"}[1m])) > 0",
          "for": "2m",
          "labels": {
            "check": "queue-waiting",
            "severity": "warning",
            "shape": "level",
            "project": "x402"
          },
          "annotations": {
            "description": "Settle on {{ $labels.network }} has waited for a free channel for 3 minutes, every sample of each minute: every channel is busy, out of the pool, or held back after a deploy (0090). Next: Check channel-quarantined and the traffic; add channels (docs/runbook.md, OpenBao) when it is load rather than faults that holds them. No data: Resolves once its series stops, which is no recovery; facilitator-silent covers a stopped process. OK once it is back within its threshold; the next crossing fires it again. Runbook: docs/monitoring.md, queue-waiting."
          }
        },
        {
          "alert": "x402-channel-quarantined",
          "expr": "max by (network) (max_over_time(pool_quarantined{project=\"x402\"}[1m])) >= 1",
          "labels": {
            "check": "channel-quarantined",
            "severity": "warning",
            "shape": "level",
            "project": "x402"
          },
          "annotations": {
            "description": "A channel on {{ $labels.network }} was taken out of the pool since the facilitator started; the pool settles with fewer channels. Next: The RPC answered that the channel's account doesn't exist (a failed read keeps the channel): settlement_submit_failed names it (Account not found: <channel>). Check it on Horizon and re-create the channels if it is gone; a restart puts the channels back. No data: Resolves once its series stops, which is no recovery; facilitator-silent covers a stopped process. OK once it is back within its threshold; the next crossing fires it again. Runbook: docs/monitoring.md, channel-quarantined."
          }
        },
        {
          "alert": "x402-sweeps-stopped",
          "expr": "sum by (network, outcome) (increase(settlement_sweeps_total{project=\"x402\",outcome=\"listed\"}[5m])) < 1",
          "labels": {
            "check": "sweeps-stopped",
            "severity": "critical",
            "shape": "level",
            "project": "x402"
          },
          "annotations": {
            "description": "No reconciliation sweep on {{ $labels.network }} listed the open records for 5 minutes: sweeps fail or hang, so a stuck settlement stays stuck. A live process writes 0 here. Next: Read reconcile_failed in the app logs; restart x402@production if a sweep hangs. No data: Resolves once its series stops, which is no recovery; facilitator-silent covers a stopped process. OK once it is back within its threshold; the next crossing fires it again. Runbook: docs/monitoring.md, sweeps-stopped."
          }
        },
        {
          "alert": "x402-rpc-on-fallback",
          "expr": "min by (network) (min_over_time(rpc_on_fallback{project=\"x402\"}[1m])) >= 1",
          "for": "14m",
          "labels": {
            "check": "rpc-on-fallback",
            "severity": "warning",
            "shape": "level",
            "project": "x402"
          },
          "annotations": {
            "description": "The facilitator's RPC on {{ $labels.network }} has run on a fallback endpoint for 15 minutes, every sample: a lagging fallback answers valid payments with rejections. Its OK is the recovery. Next: Read rpc_failover in the app logs for why endpoint 0 failed, then fix it or reorder RPC_URLS. No data: Resolves once its series stops, which is no recovery; facilitator-silent covers a stopped process. OK once it is back within its threshold; the next crossing fires it again. Runbook: docs/monitoring.md, rpc-on-fallback."
          }
        },
        {
          "alert": "x402-disk-root",
          "expr": "max(max_over_time((100 * (1 - node_filesystem_avail_bytes{project=\"x402\",mountpoint=\"/\"} / node_filesystem_size_bytes{project=\"x402\",mountpoint=\"/\"}))[5m:15s])) > 80",
          "for": "10m",
          "labels": {
            "check": "disk-root",
            "severity": "warning",
            "shape": "level",
            "project": "x402"
          },
          "annotations": {
            "description": "The server's / is over 80% used for 15 minutes. It is shared with ClickHouse; our WAL, backups and logs are what we add to it. The Prices API watches the same host's ClickHouse volume as prices-production-ch-disk-free. Next: Check du on the WAL archive, the pgBackRest repo, /var/log/x402 and Docker images; tell the ClickHouse project's owners if their data is what grew. No data: Resolves once its series stops, which is no recovery; server-silent covers a stopped agent. OK once it is back within its threshold; the next crossing fires it again. Runbook: docs/monitoring.md, disk."
          }
        },
        {
          "alert": "x402-memory",
          "expr": "min(min_over_time((100 * (1 - node_memory_MemAvailable_bytes{project=\"x402\"} / node_memory_MemTotal_bytes{project=\"x402\"}))[5m:15s])) > 90",
          "for": "10m",
          "labels": {
            "check": "memory",
            "severity": "warning",
            "shape": "level",
            "project": "x402"
          },
          "annotations": {
            "description": "The server's memory has stayed over 90% used for 15 minutes. ClickHouse shares the machine, held to its own limit. Next: Check docker stats for our containers and ClickHouse's, and the OOM lines in the kernel log. No data: Resolves once its series stops, which is no recovery; server-silent covers a stopped agent. OK once it is back within its threshold; the next crossing fires it again. Runbook: docs/monitoring.md, memory."
          }
        },
        {
          "alert": "x402-openbao-down",
          "expr": "min(min_over_time(openbao_up{project=\"x402\"}[1m])) < 1",
          "for": "2m",
          "labels": {
            "check": "openbao-down",
            "severity": "warning",
            "shape": "level",
            "project": "x402"
          },
          "annotations": {
            "description": "OpenBao has been down, sealed, or failing its check on testnet's socket for 3 minutes: the facilitator can't sign, so settlement stops. A sign that fails while OpenBao is up is signer-failures'. Next: Check x402-openbao.service and bao status on the socket; unseal or restart as in docs/runbook.md, OpenBao. No data: Resolves once its series stops, which is no recovery; textfile-stale covers a stopped host probe. OK once it is back within its threshold; the next crossing fires it again. Runbook: docs/monitoring.md, openbao-down."
          }
        },
